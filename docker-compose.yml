services:
  mongo:
    image: mongo:6
    container_name: tt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backendProject
      dockerfile: src/Project.Api/Dockerfile
    container_name: tt-api
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: timetracking
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    build:
      context: ./backendProject
      dockerfile: src/Project.Api/Dockerfile
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__DatabaseName: timetracking
    entrypoint: ["dotnet", "Project.Api.dll", "seed"]
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["tools"]

  client:
    build:
      context: ./frontendProject
    container_name: tt-client
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mongo-data:
